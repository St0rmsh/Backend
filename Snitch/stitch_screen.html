<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Complete Profile | SNITCH</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;700;800;900&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-variant": "#353534",
                    "on-tertiary-fixed-variant": "#86006f",
                    "tertiary-fixed": "#ffd8ee",
                    "on-primary": "#00363a",
                    "on-secondary-container": "#ddcdff",
                    "secondary-fixed": "#e9ddff",
                    "tertiary": "#fff2f7",
                    "primary": "#dbfcff",
                    "surface-container-highest": "#353534",
                    "on-primary-container": "#006970",
                    "surface-container-high": "#2a2a2a",
                    "inverse-on-surface": "#313030",
                    "on-secondary": "#3c0090",
                    "secondary-container": "#7000ff",
                    "on-secondary-fixed-variant": "#5700c9",
                    "tertiary-container": "#ffcaea",
                    "background": "#131313",
                    "inverse-primary": "#006970",
                    "inverse-surface": "#e5e2e1",
                    "surface": "#131313",
                    "surface-container-low": "#1c1b1b",
                    "outline": "#849495",
                    "on-error-container": "#ffdad6",
                    "error-container": "#93000a",
                    "on-error": "#690005",
                    "surface-container-lowest": "#0e0e0e",
                    "on-secondary-fixed": "#23005b",
                    "on-tertiary-fixed": "#3b002f",
                    "tertiary-fixed-dim": "#ffade2",
                    "secondary": "#d1bcff",
                    "surface-bright": "#3a3939",
                    "error": "#ffb4ab",
                    "on-primary-fixed-variant": "#004f54",
                    "secondary-fixed-dim": "#d1bcff",
                    "outline-variant": "#3b494b",
                    "on-primary-fixed": "#002022",
                    "surface-container": "#201f1f",
                    "surface-tint": "#00dbe9",
                    "on-surface": "#e5e2e1",
                    "on-tertiary-container": "#b00093",
                    "primary-fixed-dim": "#00dbe9",
                    "primary-fixed": "#7df4ff",
                    "on-background": "#e5e2e1",
                    "surface-dim": "#131313",
                    "primary-container": "#00f0ff",
                    "on-tertiary": "#5f004e",
                    "on-surface-variant": "#b9cacb"
            },
            "borderRadius": {
                    "DEFAULT": "0.375rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "fontFamily": {
                    "headline": ["Epilogue"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        .glass-card {
            background: rgba(53, 53, 52, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(59, 73, 75, 0.15);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glow-bg {
            background: radial-gradient(circle at 10% 20%, rgba(112, 0, 255, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(0, 240, 255, 0.15) 0%, transparent 40%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body selection:bg-primary-container selection:text-on-primary-container">
<!-- Suppressed Shell: Linear/Transactional Flow -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-6 h-16 bg-[#131313]/40 backdrop-blur-md shadow-[0px_10px_30px_rgba(0,240,255,0.05)]">
<div class="text-2xl font-black italic text-[#E5E2E1] tracking-[-0.04em] font-headline">SNITCH</div>
<button class="text-[#E5E2E1] hover:opacity-80 transition-opacity p-2 active:scale-95 duration-200">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<main class="min-h-screen pt-24 pb-12 px-6 flex items-center justify-center glow-bg">
<div class="w-full max-w-md glass-card rounded-2xl p-8 flex flex-col gap-10">
<!-- Hero Heading -->
<div class="space-y-2">
<h1 class="font-headline font-black text-5xl tracking-[-0.04em] text-primary">Almost there!</h1>
<p class="text-on-surface-variant font-medium text-sm tracking-wide">COMPLETE YOUR IDENTITY TO ACCESS THE DROP.</p>
</div>
<!-- Phone Input Section -->
<div class="space-y-4">
<label class="text-[10px] font-headline font-bold uppercase tracking-widest text-on-surface-variant block">MOBILE NUMBER</label>
<div class="flex gap-2">
<!-- Dropdown Mock -->
<div class="flex items-center gap-2 bg-surface-container-low px-4 py-4 rounded-md border border-outline-variant/10 cursor-pointer hover:bg-surface-container transition-colors">
<span class="text-sm font-semibold">+1</span>
<span class="material-symbols-outlined text-sm text-on-surface-variant">keyboard_arrow_down</span>
</div>
<!-- Number Input -->
<input class="flex-1 bg-surface-container-low border border-outline-variant/10 rounded-md px-4 py-4 text-sm font-medium focus:ring-1 focus:ring-primary-container focus:border-primary-container outline-none placeholder:text-on-surface-variant/30 transition-all" placeholder="000-000-0000" type="tel"/>
</div>
</div>
<!-- Profile Type Section -->
<div class="space-y-4">
<label class="text-[10px] font-headline font-bold uppercase tracking-widest text-on-surface-variant block">I WANT TO:</label>
<div class="grid grid-cols-1 gap-4">
<!-- Option 1: Buyer -->
<div class="group relative bg-surface-container-low hover:bg-surface-container-high transition-all p-6 rounded-md border border-outline-variant/10 cursor-pointer overflow-hidden active:scale-95 duration-200">
<div class="flex justify-between items-center relative z-10">
<div>
<h3 class="font-headline font-bold text-xl text-on-surface group-hover:text-primary transition-colors">Buyer</h3>
<p class="text-xs text-on-surface-variant font-medium mt-1">Shop &amp; discover</p>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary-container transition-colors">shopping_bag</span>
</div>
<div class="absolute inset-0 bg-gradient-to-r from-secondary-container/5 to-primary-container/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
</div>
<!-- Option 2: Seller -->
<div class="group relative bg-surface-container-low hover:bg-surface-container-high transition-all p-6 rounded-md border border-outline-variant/10 cursor-pointer overflow-hidden active:scale-95 duration-200">
<div class="flex justify-between items-center relative z-10">
<div>
<h3 class="font-headline font-bold text-xl text-on-surface group-hover:text-secondary transition-colors">Seller</h3>
<p class="text-xs text-on-surface-variant font-medium mt-1">List &amp; earn</p>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-secondary transition-colors">sell</span>
</div>
<div class="absolute inset-0 bg-gradient-to-r from-secondary-container/5 to-primary-container/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
</div>
</div>
</div>
<!-- Terms/Privacy -->
<p class="text-[10px] text-center text-on-surface-variant leading-relaxed px-4">
                BY CONTINUING, YOU AGREE TO OUR <span class="text-primary hover:underline cursor-pointer">TERMS OF SERVICE</span> AND <span class="text-primary hover:underline cursor-pointer">PRIVACY POLICY</span>.
            </p>
<!-- Main CTA -->
<button class="w-full bg-gradient-to-r from-secondary-container to-primary-container text-on-primary-fixed py-5 rounded-md font-headline font-black text-sm uppercase tracking-[0.1em] shadow-[0_0_25px_rgba(0,240,255,0.2)] hover:shadow-[0_0_35px_rgba(0,240,255,0.4)] transition-all active:scale-[0.98] duration-150">
                Complete Profile
            </button>
</div>
</main>
<!-- Aesthetic Floating Elements -->
<div class="fixed top-[20%] left-[5%] w-64 h-64 bg-secondary-container/10 blur-[100px] pointer-events-none -z-10"></div>
<div class="fixed bottom-[10%] right-[5%] w-80 h-80 bg-primary-container/10 blur-[120px] pointer-events-none -z-10"></div>
<!-- Hidden decorative branding for context -->
<div class="fixed bottom-10 left-10 pointer-events-none opacity-5 select-none hidden lg:block">
<h2 class="font-headline font-black text-9xl tracking-tighter leading-none">THE<br/>DIGITAL<br/>VELVET</h2>
</div>
</body></html>
