apiVersion: apps/v1
kind: Deployment
metadata:
  name:  auth-deployment
  labels:
    app:  auth-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app:  auth
  template:
    metadata:
      labels:
        app:  auth
    spec:
      containers:
      - image:  auth
        name:  auth-container
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /_status/healthz
            port: 3000
          initialDelaySeconds: 90
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /_status/healthz
            port: 3000
          initialDelaySeconds: 30
          timeoutSeconds: 10
        env:
        - name:  AUTH_MONGO_URI
          valueFrom: 
            secretKeyRef:
              name:  database
              key:  AUTH

        - name:  RABBITMQ_URL
          valueFrom: 
            secretKeyRef:
              name:  amqlib
              key:  RABBITMQ_URL

        - name:  RABBITMQ_PORT
          valueFrom: 
            secretKeyRef:
              name:  amqlib
              key:  RABBITMQ_PORT

        - name:  GOOGLE_CLIENT_ID
          valueFrom: 
            secretKeyRef:
              name:  google
              key:  GOOGLE_CLIENT_ID

        - name:  GOOGLE_CLIENT_SECRET
          valueFrom: 
            secretKeyRef:
              name:  google
              key:  GOOGLE_CLIENT_SECRET
        
        - name:  AUTH_JWT_SECRET
          valueFrom: 
            secretKeyRef:
              name:  jwt
              key:  AUTH_JWT_SECRET
        ports:
        - containerPort:  3000
          name:  auth-http
      